<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f7">

<title>UPI Payment</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: linear-gradient(145deg, #ffffff, #f1f1f3);
    color: #171717;
}

.container {
    width: 100%;
    max-width: 420px;
}

.card {
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(0,0,0,.06);
    border-radius: 28px;

    padding: 38px 26px 28px;

    box-shadow: 0 20px 60px rgba(0,0,0,.08);

    text-align: center;
}

.logo {
    width: 76px;
    height: 76px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 22px;

    background: #111;
    color: white;

    font-size: 30px;
    font-weight: 700;

    box-shadow: 0 10px 25px rgba(0,0,0,.15);
}

h1 {
    font-size: 24px;
    letter-spacing: -.5px;
    margin-bottom: 8px;
}

.subtitle {
    color: #737373;
    font-size: 15px;
    margin-bottom: 28px;
}

.status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;

    color: #666;
    font-size: 14px;

    margin-bottom: 24px;
}

.loader {
    width: 17px;
    height: 17px;

    border: 2px solid #ddd;
    border-top-color: #111;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.app-options {
    display: none;
    margin-top: 10px;
}

.choose-text {
    color: #666;
    font-size: 14px;
    margin-bottom: 16px;
}

.app-button {
    width: 100%;

    display: flex;
    align-items: center;

    padding: 15px 16px;
    margin-bottom: 10px;

    border: 1px solid #e5e5e5;
    border-radius: 15px;

    background: white;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: transform .15s ease, background .15s ease;
}

.app-button:active {
    transform: scale(.98);
    background: #f5f5f5;
}

.app-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 12px;

    border-radius: 11px;

    background: #f1f1f1;

    font-weight: 700;
    font-size: 16px;
}

.pay-button {
    width: 100%;

    padding: 16px;

    border: none;
    border-radius: 16px;

    background: #111;
    color: white;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;
}

.secure {
    margin-top: 22px;

    color: #999;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

    <div class="logo">G</div>

    <h1>Gaurav Puttannachetty</h1>

    <p class="subtitle">
        Secure UPI Payment
    </p>

    <!-- Android -->
    <div id="androidStatus" class="status">
        <div class="loader"></div>
        <span>Opening your payment app...</span>
    </div>

    <!-- iPhone -->
    <div id="iosOptions" class="app-options">

        <p class="choose-text">
            Choose your UPI app
        </p>

        <button class="app-button" onclick="openUPI('gpay')">
            <span class="app-icon">G</span>
            Google Pay
        </button>

        <button class="app-button" onclick="openUPI('phonepe')">
            <span class="app-icon">P</span>
            PhonePe
        </button>

        <button class="app-button" onclick="openUPI('paytm')">
            <span class="app-icon">P</span>
            Paytm
        </button>

        <button class="app-button" onclick="openUPI('bhim')">
            <span class="app-icon">B</span>
            BHIM
        </button>

    </div>

    <!-- Android fallback -->
    <button
        id="androidFallback"
        class="pay-button"
        onclick="openAndroidUPI()"
    >
        Pay with UPI
    </button>

    <div class="secure">
        🔒 Secure UPI payment
    </div>

</div>

</div>

<script>

const params =
    "pa=gauravputtannachetty35@oksbi" +
    "&pn=Gaurav%20Puttannachetty" +
    "&cu=INR";

const apps = {

    gpay:
        "gpay://upi/pay?" + params,

    phonepe:
        "phonepe://upi/pay?" + params,

    paytm:
        "paytm://upi/pay?" + params,

    bhim:
        "bhim://upi/pay?" + params

};

function isIOS() {
    return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function openUPI(app) {
    window.location.href = apps[app];
}

function openAndroidUPI() {
    window.location.href = "upi://pay?" + params;
}

window.addEventListener("load", function() {

    if (isIOS()) {

        document.getElementById("androidStatus").style.display = "none";
        document.getElementById("androidFallback").style.display = "none";

        document.getElementById("iosOptions").style.display = "block";

    } else {

        setTimeout(function() {
            openAndroidUPI();
        }, 150);

    }

});

</script>

</body>
</html>
