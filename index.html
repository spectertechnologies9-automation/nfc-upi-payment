<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f7f7f8">

    <title>UPI Payment</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #ffffff 0%,
                    #f5f5f7 45%,
                    #eeeeef 100%
                );

            color: #171717;
        }

        .container {
            width: min(92%, 420px);
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(0, 0, 0, 0.06);

            border-radius: 28px;

            padding: 42px 28px 30px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 76px;
            height: 76px;

            margin: 0 auto 20px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;

            color: white;

            font-size: 30px;
            font-weight: 700;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #737373;
            font-size: 15px;

            margin-bottom: 30px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-bottom: 28px;

            font-size: 14px;
            color: #555;
        }

        .loader {
            width: 18px;
            height: 18px;

            border: 2px solid #ddd;
            border-top-color: #111;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .pay-button {
            width: 100%;

            border: none;

            border-radius: 16px;

            padding: 17px;

            background: #111;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .pay-button:active {
            transform: scale(0.98);
        }

        .pay-button:hover {
            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.18);
        }

        .secure {
            margin-top: 22px;

            font-size: 12px;
            color: #8a8a8a;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 6px;
        }

        .upi {
            margin-top: 25px;

            font-size: 12px;

            color: #aaa;

            word-break: break-all;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                G
            </div>

            <h1>Gaurav Puttannachetty</h1>

            <p class="subtitle">
                Secure UPI Payment
            </p>

            <div class="status">
                <div class="loader"></div>
                <span>Opening your payment app...</span>
            </div>

            <button class="pay-button" onclick="openUPI()">
                Pay with UPI
            </button>

            <div class="secure">
                🔒 Secure UPI payment
            </div>

        </div>

    </div>

<script>

    const upiUrl =
        "upi://pay?pa=gauravputtannachetty35@oksbi&pn=Gaurav%20Puttannachetty&cu=INR";

    function openUPI() {
        window.location.href = upiUrl;
    }

    // Automatically launch UPI
    window.addEventListener("load", () => {

        setTimeout(() => {
            openUPI();
        }, 150);

    });

</script>

</body>
</html>
